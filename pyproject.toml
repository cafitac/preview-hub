[project]
name = "preview-hub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "PyYAML>=6.0"]
[project.scripts]
phub = "preview_hub.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["preview_hub"]
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "preview_hub/schemas"
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1.390", "types-PyYAML", "types-jsonschema"]
[tool.pyright]
include = ["preview_hub"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
[tool.ruff]
target-version = "py312"
[tool.pytest.ini_options]
testpaths = ["tests"]
