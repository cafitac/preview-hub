services:
  hub:
    image: phub/hub:local
    container_name: phub-hub
    # Colima's root-owned socket normally requires root. Override with uid:gid
    # only after granting that uid socket access and ownership of both volumes.
    user: "${PHUB_UID_GID:-0:0}"
    command: [phub, serve]
    env_file:
      - path: /opt/phub/public.env
        required: false
    restart: unless-stopped
    environment:
      PHUB_RUNNER: compose
      PHUB_DAEMON_NAME: colima-preview-hub
      PHUB_GC_INTERVAL: "900"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - phub-state:/state
      - phub-src:/src
      # Read-only GitHub token for pr refs and listing.
      - /opt/phub/secrets:/run/secrets:ro
      - ./catalog.yaml:/etc/phub/catalog.yaml:ro
    labels:
      dev.phub.managed: "true"
      dev.phub.service: hub
  bot:
    image: phub/hub:local
    container_name: phub-bot
    user: "${PHUB_UID_GID:-0:0}"
    command: [phub, bot]
    restart: unless-stopped
    environment:
      PHUB_BOT_INTERVAL: "${PHUB_BOT_INTERVAL:-20}"
    volumes:
      # Bot code uses the socket only for docker exec phub-hub phub.
      - /var/run/docker.sock:/var/run/docker.sock
      - phub-state:/state
      - ./catalog.yaml:/etc/phub/catalog.yaml:ro
      - /opt/phub/secrets:/run/secrets:ro
    labels:
      dev.phub.managed: "true"
      dev.phub.service: bot
  cloudflared:
    image: cloudflare/cloudflared:2025.2.1
    container_name: phub-cloudflared
    user: "${PHUB_UID_GID:-0:0}"
    profiles: [public]
    command: [tunnel, --no-autoupdate, --config, /etc/cloudflared/config.yml, run, "${PHUB_TUNNEL_ID:-}"]
    restart: unless-stopped
    environment:
      PHUB_TUNNEL_ID: "${PHUB_TUNNEL_ID:-}"
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - /opt/phub/secrets/tunnel.json:/etc/cloudflared/tunnel.json:ro
    labels:
      dev.phub.managed: "true"
      dev.phub.service: cloudflared
  proxy:
    image: traefik:v3
    container_name: phub-proxy
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`dev.phub.managed`,`true`)
      - --entrypoints.web.address=:80
    ports: ["127.0.0.1:18080:80"]
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
    labels:
      dev.phub.managed: "true"
      dev.phub.service: proxy
volumes:
  phub-state:
    name: phub-state
    labels: {dev.phub.managed: "true", dev.phub.service: hub}
  phub-src:
    name: phub-src
    labels: {dev.phub.managed: "true", dev.phub.service: hub}
networks:
  default:
    labels: {dev.phub.managed: "true", dev.phub.service: hub}
