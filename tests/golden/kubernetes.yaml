      targetPort: 8080
- apiVersion: traefik.io/v1alpha1
  kind: Middleware
  metadata:
    name: frontend-auth
    namespace: phub-test-one
    labels:
      dev.phub.managed: 'true'
      dev.phub.env: test-one
      dev.phub.service: frontend
      dev.phub.role: service
  spec:
    forwardAuth:
      address: http://hub.preview-hub.svc.cluster.local:8080/auth/verify
      trustForwardHeader: false
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: frontend
    namespace: phub-test-one
    labels:
      dev.phub.managed: 'true'
      dev.phub.env: test-one
      dev.phub.service: frontend
      dev.phub.role: service
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: phub-test-one-frontend-auth@kubernetescrd
      traefik.ingress.kubernetes.io/router.priority: '10'
  spec:
    rules:
    - host: phub-test-one.cafitac.com
